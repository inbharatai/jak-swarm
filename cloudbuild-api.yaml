# ─── JAK Swarm API — Cloud Build + Cloud Run ─────────────────────────────────
#
# Build the API Docker image and deploy to Cloud Run.
#
# Prerequisites:
#   1. gcloud CLI installed and authenticated
#   2. Artifact Registry repo created (see DEPLOYMENT_GOOGLE_CLOUD_RUN.md)
#   3. Secret Manager secrets created for all sensitive env vars
#   4. Service account with roles/run.admin, roles/secretmanager.secretAccessor
#
# Usage:
#   gcloud builds submit --config=cloudbuild-api.yaml \
#     --substitutions=_REGION=us-central1,_SERVICE_NAME=jak-swarm-api
#
# Or use the deployment guide for step-by-step instructions.

steps:
  # ─── Step 1: Build the Docker image ───────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.api'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '.'

  # ─── Step 2: Push images to Artifact Registry ─────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}']

  # ─── Step 3: Deploy to Cloud Run ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=4000'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--timeout=300'
      - '--no-allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production,PORT=4000,WORKFLOW_WORKER_MODE=embedded,PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser'
      # ── Secrets (mounted from Google Secret Manager) ──
      # Update these after creating secrets with deploy/create-secrets.sh
      # Uncomment and adjust once secrets are created:
      # - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      # - '--set-secrets=AUTH_SECRET=AUTH_SECRET:latest'
      # - '--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest'
      # - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
      # - '--set-secrets=REDIS_URL=REDIS_URL:latest'
      # - '--set-secrets=SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest'
      # - '--set-secrets=EVIDENCE_SIGNING_SECRET=EVIDENCE_SIGNING_SECRET:latest'
      # - '--set-secrets=METRICS_TOKEN=METRICS_TOKEN:latest'
      # - '--set-secrets=NEXT_PUBLIC_SUPABASE_URL=NEXT_PUBLIC_SUPABASE_URL:latest'
      # - '--set-secrets=NEXT_PUBLIC_SUPABASE_ANON_KEY=NEXT_PUBLIC_SUPABASE_ANON_KEY:latest'
      # - '--set-secrets=CORS_ORIGINS=CORS_ORIGINS:latest'

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: jak-swarm-api
  _REPO_NAME: jak-swarm

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'
name: Landing unit debug

on:
  pull_request:
    branches: [main]

jobs:
  landing-test:
    if: github.event.pull_request.head.ref == 'codex/clean-multiplayer-positioning'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Run landing truth test and capture output
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @jak-swarm/tests exec vitest run unit/landing/landing-claim-vs-code.test.ts --reporter=verbose 2>&1 | tee landing-unit-debug.log
      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: landing-unit-debug-${{ github.sha }}
          path: landing-unit-debug.log
          retention-days: 2
      - name: Enforce result
        if: steps.test.outcome == 'failure'
        run: exit 1

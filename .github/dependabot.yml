# Dependabot config — weekly dependency updates with security-focused grouping.
#
# Strategy:
# - Weekly cadence (Monday 09:00 UTC) keeps noise low while staying current.
# - npm updates are grouped per ecosystem so we get ~2-3 PRs/week max.
# - github-actions pins are updated separately (rarer, security-sensitive).
# - All PRs carry the `security` label so the security-gate CI job runs them.
# - Security-only updates open immediately, regardless of schedule, for
#   anything Dependabot classifies as a vulnerability.
version: 2
updates:
  # ─── Node workspace (monorepo root + all packages/apps) ─────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Major-version bumps for these deps need dedicated migration work
    # (breaking API/schema/SDK changes) and were closed rather than merged:
    #   #107 prisma 6→7, #108 @fastify/{cors,rate-limit} 10→11 + swagger-ui 5→6,
    #   #109 vitest 2→4 (+ @vitest/coverage-v8), #110 typescript 5→6,
    #   #114 openai 4→6, #115 zod 3→4, #116 lucide-react 0.4→1.x,
    #   #122 testcontainers 10→12, #123 @types/node 22→26.
    # Ignoring semver-major here so Dependabot doesn't re-open them weekly.
    # Patch + minor bumps for the same deps STILL come through; remove an
    # entry here when its migration is intentionally started.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/cors"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/rate-limit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fastify/swagger-ui"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "testcontainers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Group related ecosystems so we don't drown in one-off PRs.
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
      tooling:
        patterns:
          - "typescript"
          - "eslint*"
          - "prettier"
          - "turbo"
      # Remaining runtime deps are grouped by update-type so a single PR
      # can't bundle 29 bumps spanning patch/minor/major — that blast radius
      # is impossible to reason about in review. Patch bumps auto-group
      # (low risk, quick merge); minor/major updates come as individual PRs.
      production-deps-patch:
        dependency-type: "production"
        update-types:
          - "patch"
        exclude-patterns:
          - "fastify"
          - "@fastify/*"
          - "prisma"
          - "@prisma/*"
      production-deps-minor:
        dependency-type: "production"
        update-types:
          - "minor"
        exclude-patterns:
          - "fastify"
          - "@fastify/*"
          - "prisma"
          - "@prisma/*"
      # Major production bumps are NOT grouped — each gets its own PR.
      development-deps-patch:
        dependency-type: "development"
        update-types:
          - "patch"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
          - "typescript"
          - "eslint*"
          - "prettier"
          - "turbo"
      development-deps-minor:
        dependency-type: "development"
        update-types:
          - "minor"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
          - "typescript"
          - "eslint*"
          - "prettier"
          - "turbo"

  # ─── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"

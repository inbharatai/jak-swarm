      <stop stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(990 470) rotate(215) scale(390 290)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24" stop-opacity="0.12"/>
